[package]
name = "media-gen"
version = "0.1.0"
edition = "2024"
description = "Self-contained media test-case generator for the Chromium/Discord parser findings"

[[bin]]
name = "media-gen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
